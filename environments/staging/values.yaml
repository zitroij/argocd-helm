# Staging environment configuration
replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.21"

service:
  type: ClusterIP
  port: 80

configMaps:
  app-config:
    data:
      APP_NAME: "sample-application"
      APP_ENV: "staging"
      LOG_LEVEL: "info"
  
  database-config:
    data:
      DB_HOST: "postgres-staging.default.svc.cluster.local"
      DB_PORT: "5432"
      DB_NAME: "appdb_staging"

resources:
  limits:
    cpu: 150m
    memory: 192Mi
  requests:
    cpu: 75m
    memory: 96Mi

nodeSelector: {}

tolerations: []

affinity: {}

